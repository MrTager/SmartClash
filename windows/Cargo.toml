[package]
name = "smartclash-windows"
version = "0.8.4"
edition = "2021"
description = "SmartClash Windows client - Rust port of the macOS SwiftUI original"
license = "GPL-3.0"

[[bin]]
name = "SmartClash"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

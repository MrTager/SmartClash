[package]
name = "smartclash-windows"
version = "0.8.11"
edition = "2021"
description = "SmartClash Windows client - Rust port of the macOS SwiftUI original"
license = "GPL-3.0"

[[bin]]
name = "SmartClash"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_IO", "Win32_System_Com", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_Security_Cryptography"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
